version: '3'
services:
  langgraph_agent_env:
    image: langgraph_agent_env
    container_name: langgraph_agent_env
    build:
      context: ..
      dockerfile: ./docker/python_env/Dockerfile
    environment:
      TZ: Asia/Shanghai
    networks:
      - langgraph_agent_network

  langgraph_agent:
    image: langgraph_agent
    container_name: langgraph_agent
    volumes:
      - /home/langgraph_agent/upload:/app/upload
    build:
      context: ..
      dockerfile: ./docker/server/Dockerfile
    environment:
      TZ: Asia/Shanghai
    ports:
      - "18000:8000"
    restart: no
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - langgraph_agent_env
    networks:
      - langgraph_agent_network

# compose 自建网络（数据层为 SQLite 文件，无需独立数据库容器）
networks:
  langgraph_agent_network:
    name: langgraph_agent_network
    driver: bridge
